<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sertifikat — belajarislam.online</title>
  <link rel="icon" href="../assets/img/favicon.ico?v=641" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icon-32.png?v=641" />
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/img/icon-64.png?v=641" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-180.png?v=641" />
  <link rel="stylesheet" href="../assets/css/styles.css?v=641" />
</head>
<body class="cert-page-body">
  <div class="toast" id="toast"></div>
  <div class="cert-page">
    <div style="width:min(1120px,100%);">
      <div class="cert-actions" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
        <a class="btn" id="backToClass" href="dashboard.html">← Kembali ke Kelas</a>
        <button class="btn primary" id="printCertBtn">Cetak / Simpan PDF</button>
      </div>
      <section class="cert-paper" id="certificatePaper">
        <img class="cert-logo" src="../assets/img/logo-icon.svg" alt="belajarislam.online" />
        <div class="muted" style="font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-top:14px;">belajarislam.online</div>
        <h1 class="cert-title">Sertifikat Penyelesaian</h1>
        <p class="cert-small">Dengan ini menyatakan bahwa</p>
        <div class="cert-name" id="certStudentName">-</div>
        <p class="cert-small">telah menyelesaikan seluruh materi pembelajaran dan memenuhi evaluasi pada kelas</p>
        <div class="cert-course" id="certClassTitle">-</div>
        <p class="cert-small" id="certTeacherText">-</p>
        <div class="cert-footer">
          <div class="cert-sign"><strong id="certDate">-</strong><div class="muted">Tanggal penerbitan</div></div>
          <div class="cert-sign"><strong id="certSigner">-</strong><div class="muted" id="certSignerTitle">Pembimbing Program</div></div>
        </div>
        <div class="muted" style="margin-top:28px;font-size:12px;">ID Sertifikat: <span id="certId">-</span></div>
      </section>
    </div>
  </div>
  <script type="module" src="../assets/js/certificate.js?v=641"></script>
</body>
</html>
