<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#103d78">
  <meta name="description" content="CAHAYA ACADEMY — LMS Pesantren Cahaya Fajrul Islam">
  <title>CAHAYA ACADEMY</title>
  <link rel="icon" href="assets/logofi.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="appLoader" class="app-loader" aria-live="polite">
    <div class="loader-card">
      <img class="loader-logo" src="assets/logofi.png" alt="Logo CAHAYA ACADEMY">
      <div class="loader-title">CAHAYA ACADEMY</div>
      <div class="loader-subtitle">Menyiapkan ruang belajar Anda</div>
      <div class="loader-bar"></div>
    </div>
  </div>

  <div id="authRoot" class="hidden"></div>
  <div id="appRoot" class="hidden"></div>
  <div id="modalRoot" class="modal-backdrop" aria-hidden="true"></div>
  <div id="toastRoot" class="toast-stack" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    window.setTimeout(function () {
      var loader = document.getElementById("appLoader");
      var authRoot = document.getElementById("authRoot");
      var appRoot = document.getElementById("appRoot");
      if (loader && !loader.classList.contains("is-hidden") && !authRoot.innerHTML && !appRoot.innerHTML) {
        loader.innerHTML = '<div class="loader-card"><img class="loader-logo" src="assets/logofi.png" alt="Logo"><div class="loader-title">Koneksi belum berhasil</div><div class="loader-subtitle" style="max-width:340px;line-height:1.6">Periksa internet, pengaturan Firebase, atau muat ulang halaman.</div><button class="btn btn-primary" style="margin-top:18px" onclick="location.reload()">Muat Ulang</button></div>';
      }
    }, 12000);
  </script>
</body>
</html>
